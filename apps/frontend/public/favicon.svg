<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="TodoAPP">
  <defs>
    <linearGradient id="note" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#7aa3ff"/>
      <stop offset="100%" stop-color="#3a5cff"/>
    </linearGradient>
    <linearGradient id="noteBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#5b8cff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#2b46cc" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.4" stdDeviation="1.4" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- back banknote (slight counter-rotation, dimmer) -->
  <g transform="rotate(-8 32 32)" filter="url(#shadow)">
    <rect x="8" y="22" width="48" height="24" rx="4" fill="url(#noteBack)"/>
  </g>

  <!-- front banknote -->
  <g transform="rotate(6 32 32)" filter="url(#shadow)">
    <rect x="6" y="20" width="52" height="26" rx="4.5" fill="url(#note)"/>
    <!-- decorative inner border -->
    <rect x="8.5" y="22.5" width="47" height="21" rx="3" fill="none"
          stroke="#ffffff" stroke-opacity="0.25" stroke-width="1"/>
    <!-- center circle holding the value glyph -->
    <circle cx="32" cy="33" r="8.5" fill="#ffffff" fill-opacity="0.12"
            stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.2"/>
    <!-- $ glyph -->
    <text
      x="32" y="38"
      text-anchor="middle"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, ui-sans-serif, system-ui, sans-serif"
      font-weight="900"
      font-size="14"
      fill="#ffffff"
      style="letter-spacing:-0.02em"
    >$</text>
    <!-- subtle corner accents -->
    <circle cx="11.5" cy="25.5" r="1.4" fill="#ffffff" fill-opacity="0.5"/>
    <circle cx="52.5" cy="40.5" r="1.4" fill="#ffffff" fill-opacity="0.5"/>
  </g>
</svg>
