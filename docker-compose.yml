# =============================================================================
# TodoAPP — only application services. PostgreSQL is intentionally OMITTED:
# we attach to the pre-existing `awlsrvDB_postgres` container via the shared
# external network `awl_network`.
#
# Prereq (one-time, run on the host if it does not exist):
#   docker network inspect awl_network >/dev/null 2>&1 || \
#     docker network create awl_network
#
# Run from this directory:
#   docker compose --env-file .env up -d --build
# =============================================================================

services:
  app_todoapp_backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: app_todoapp_backend
    env_file:
    - .env
    environment:
      NODE_ENV: production
      PORT: 3000
    networks:
      awl_network:
        aliases:
        - todoapp_backend
    expose:
    - "3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  app_todoapp_frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_LOGINHUB_API_URL: ${VITE_LOGINHUB_API_URL}
        VITE_MONEYAPP_API_URL: ${VITE_MONEYAPP_API_URL}
    container_name: app_todoapp_frontend
    depends_on:
      app_todoapp_backend:
        condition: service_healthy
    networks:
      awl_network:
        aliases:
        - todoapp_frontend
    restart: unless-stopped

  app_todoapp_bot:
    build:
      context: apps/bot
    container_name: app_todoapp_bot
    env_file:
      - .env
    networks:
      awl_network:
        aliases:
        - todoapp_bot
    restart: unless-stopped

networks:
  awl_network:
    external: true
