# =============================================================================
# TodoAPP — only application services. PostgreSQL is intentionally OMITTED:
# we attach to the pre-existing `awlsrvDB_postgres` container via the shared
# external network `awl_network`.
#
# Prereq (one-time, run on the host if it does not exist):
#   docker network inspect awl_network >/dev/null 2>&1 || \
#     docker network create awl_network
#
# Run from this directory:
#   docker compose --env-file .env up -d --build
# =============================================================================

services:
  lbs_todoapp_backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: lbs_todoapp_backend
    env_file:
    - ../shared.env
    - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      # DATABASE_URL montado a partir do DB_DSN (../shared.env) + DB_NAME (.env).
      DATABASE_URL: "${DB_DSN:?defina DB_DSN em ../shared.env}/${DB_NAME:?defina DB_NAME no .env do app}"
      # Versão do build (gerada por scripts/bump-version.mjs). Sai no /health
      # e é o que o front compara para descobrir que houve deploy.
      APP_VERSION: ${APP_VERSION:-0.0.0}
      APP_BUILD_DATE: ${APP_BUILD_DATE:-}
    networks:
      awl_network:
        aliases:
        - todoapp_backend
    expose:
    - "3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  lbs_todoapp_frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_LOGINHUB_API_URL: ${VITE_LOGINHUB_API_URL}
        # Sem o app_id o hub responde 409 AMBIGUOUS_EMAIL quando o mesmo e-mail
        # existe em mais de um app. Ja estava no .env, faltava chegar no build.
        VITE_LOGINHUB_APP_ID: ${VITE_LOGINHUB_APP_ID}
        # Mesma versão do backend, congelada no bundle pelo vite build.
        VITE_APP_VERSION: ${APP_VERSION:-0.0.0}
        VITE_APP_BUILD_DATE: ${APP_BUILD_DATE:-}
        # Base da plataforma central de notificacoes (LBS Notify). VAZIO = o app
        # continua usando as rotas /api/push/* dele mesmo. Preenchido, o
        # aparelho passa a ser registrado na central. Ver LBSNotify/README.md.
        VITE_LBS_NOTIFY_URL: ${VITE_LBS_NOTIFY_URL:-}
        VITE_MONEYAPP_API_URL: ${VITE_MONEYAPP_API_URL}
    container_name: lbs_todoapp_frontend
    depends_on:
      lbs_todoapp_backend:
        condition: service_healthy
    networks:
      awl_network:
        aliases:
        - todoapp_frontend
    restart: unless-stopped

  lbs_todoapp_bot:
    build:
      context: apps/bot
    container_name: lbs_todoapp_bot
    env_file:
      - ../shared.env
      - .env
    environment:
      DATABASE_URL: "${DB_DSN:?defina DB_DSN em ../shared.env}/${DB_NAME:?defina DB_NAME no .env do app}"
    networks:
      awl_network:
        aliases:
        - todoapp_bot
    restart: unless-stopped

networks:
  awl_network:
    external: true
